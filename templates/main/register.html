{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center"
      style="background: url('{% static 'main/login-bg.png' %}') no-repeat center center/cover;">
    <div class="bg-white rounded-[2.5rem] shadow-xl p-6 sm:p-12 w-full max-w-xs sm:max-w-xl flex flex-col items-center"
         style="box-shadow: 0 8px 24px 0 rgba(0,0,0,0.10);">
        <h1 class="text-4xl font-bold text-blue-500 mb-4 mt-4">Loop</h1>
        <p class="mb-8 text-center text-gray-500">Create your account to get started with Loop</p>
        <form action="{% url 'register' %}" method="post" class="w-full flex flex-col gap-4">
            <div class="flex flex-col sm:flex-row gap-3">
                {% if error %}
                <p class="text-red-500 text-sm text-center">{{ error }}</p>
                {% endif %}
                {% if success %}
                <p class="text-green-500 text-sm text-center">{{ success }}</p>
                {% endif %}
                <input type="text" name="display_name" placeholder="First Name" class="flex-1 p-4 rounded-lg shadow focus:outline-none border border-gray-200 bg-gray-50" required />
                <input type="text" name="last_name" placeholder="Last Name" class="flex-1 p-4 rounded-lg shadow focus:outline-none border border-gray-200 bg-gray-50" required />
            </div>

            <input type="email" name="email" placeholder="Email Address" class="p-4 rounded-lg shadow focus:outline-none border border-gray-200 bg-gray-50" required />
            <input type="password" name="password" placeholder="Password" class="p-4 rounded-lg shadow focus:outline-none border border-gray-200 bg-gray-50" required />
            <input type="password" name="confirm_password" placeholder="Confirm Password" class="p-4 rounded-lg shadow focus:outline-none border border-gray-200 bg-gray-50" required />
            <button class="bg-blue-500 text-white shadow-lg rounded-xl py-4 text-xl font-semibold mt-4 transition hover:bg-blue-600">Create Account</button>
        </form>
        <p class="mt-4 text-gray-500 text-sm">Already have an account? <a href="{% url 'login' %}" class="text-blue-500 underline">Sign in</a></p>
        <div class="flex items-center justify-center my-4 w-full">
            <hr class="flex-grow border-gray-200" />
            <span class="px-4 text-gray-400 font-bold text-sm">OR</span>
            <hr class="flex-grow border-gray-200" />
        </div>
        <div class="flex items-center justify-center gap-6 mt-4">
            <button class="flex items-center justify-center w-12 h-12 rounded-full border border-gray-300 bg-white shadow-sm hover:bg-gray-50 transition">
                <img src="{% static 'main/googleicon.png' %}" alt="Google" class="w-7 h-7" />
            </button>
        </div>
    </div>
</body> 
</html>
