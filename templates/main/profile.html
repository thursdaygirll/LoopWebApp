{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-white">
    <div class="flex flex-col lg:flex-row min-h-screen">
        <!-- Sidebar/Topbar -->
        <aside class="bg-[#08A6F7] flex flex-row lg:flex-col items-center px-4 py-4 lg:py-8 rounded-3xl lg:rounded-[2.5rem] m-0 lg:m-4 w-full lg:w-32">
            <h2 class="text-2xl font-bold text-white tracking-wide mr-8 lg:mr-0 lg:mb-12">Loop</h2>
            <nav class="flex flex-row gap-10 flex-1 lg:flex-col lg:gap-20 lg:mt-40">
                <a href="/dashboard/" class="text-white hover:opacity-80 transition">
                    <img src="{% static 'main/homeicon.png' %}" alt="Home" class="w-8 h-8 lg:w-10 lg:h-10" />
                </a>
                <a href="/profile/" class="text-white hover:opacity-80 transition">
                    <img src="{{ photo_url }}" alt="Profile" class="w-8 h-8 lg:w-10 lg:h-10" />
                </a>
            </nav>
            <a href="/" class="text-white hover:opacity-80 transition ml-auto lg:ml-0 lg:mt-auto">
                <img src="{% static 'main/logouticon.png' %}" alt="Logout" class="w-7 h-7 lg:w-8 lg:h-8" />
            </a>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-16">
            <!-- Perfil del Usuario -->
            <div class="flex flex-col sm:flex-row gap-4 sm:gap-8 mb-8 justify-center items-center sm:justify-start sm:items-start">
                <div class="w-32 h-32 sm:w-36 sm:h-36 rounded-full bg-[#08A6F7] flex items-center justify-center overflow-hidden">
                    <img src="{{ profile_picture|default_if_none:'/static/main/user.png' }}" alt="Profile Picture" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full object-cover" />
                </div>
                <div class="text-center sm:text-left">
                    <h1 class="text-2xl sm:text-3xl font-bold">Hi, {{ name }}!</h1>
                    <p class="text-gray-400 text-sm">{{ email }}</p>
                </div>
            </div>

            <!-- Formulario para actualizar perfil -->
            <form method="post" enctype="multipart/form-data" action="{% url 'update_profile' %}" class="max-w-md w-full mx-auto">
                {% csrf_token %}

                <input type="hidden" name="user_id" value="{{ user_id }}">
                <input type="hidden" name="user_id" value="algun_valor_de_uid">

                <input type="text" name="username" value="{{ name }}" placeholder="Username" class="w-full mb-4 p-3 rounded-lg border border-gray-200 bg-gray-50" />
                <input type="email" name="email" value="{{ email }}" placeholder="Mail" class="w-full mb-4 p-3 rounded-lg border border-gray-200 bg-gray-50" />
                <input type="password" name="password" placeholder="Password" class="w-full mb-4 p-3 rounded-lg border border-gray-200 bg-gray-50" />

                <div class="mb-6">
                    <label class="block mb-2 text-gray-500">Profile Picture</label>
                    <input type="file" name="profile_picture" accept="image/*"
                        class="border-2 border-dashed border-gray-200 rounded-xl p-4 sm:p-6 w-full text-gray-400 bg-gray-50" />
                </div>

                <button class="w-full bg-green-100 rounded-xl py-3 font-medium text-lg text-green-700 shadow transition hover:bg-green-200">
                    Save
                </button>
            </form>
        </main>
    </div>
</body>
</html>
